<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IRPF Mensal — “Assalto Mensal”</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Calculadora de IRPF</h1>
    <p class="subtitulo">Cálculo do Imposto de Renda mensal (tabela vigente em Janeiro/2024)</p>

    <div class="campo">
      <label for="salario">Salário mensal (R$)</label>
      <input type="number" id="salario" placeholder="Ex: 3500.00" min="0" step="0.01">
    </div>

    <div class="botoes">
      <button id="btnCalcular" onclick="calcular()">Calcular</button>
      <button id="btnLimpar" onclick="limpar()">Limpar</button>
    </div>

    <div id="resultado" class="resultado escondido">
      <div class="linha-resultado">
        <span>Imposto de Renda devido:</span>
        <strong id="valorImposto">R$ 0,00</strong>
      </div>
      <div class="linha-resultado">
        <span>Alíquota efetiva:</span>
        <strong id="valorAliquota">0,00%</strong>
      </div>
    </div>

    <p id="erro" class="erro escondido">Por favor, informe um salário válido.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
